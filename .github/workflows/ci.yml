name: CI

# Fast feedback on every push/PR: analyze + test, plus a release APK build so
# a change that only breaks the Android side (Gradle, manifest, Kotlin,
# resources) is caught on the PR rather than during a release. Nothing here
# is published; cutting an actual release is release.yml.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  android-release-build:
    name: Android release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Same memory settings as release.yml, so this fails or passes for the
      # same reasons a real release would.
      - name: Configure Gradle memory
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "kotlin.daemon.jvm.options=-Xmx1024m" >> android/gradle.properties
          echo "kotlin.incremental=false" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties

      # Debug-key signed (no key.properties here): fine for a build check.
      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      # Inspects the APK that was just built (see tool/check_apk.py for what
      # it guards): manifest classes present, name-looked-up resources not
      # stripped, engine libraries and assets bundled.
      - name: Check the built APK
        run: |
          pip install --quiet androguard
          python tool/check_apk.py build/app/outputs/flutter-apk/app-release.apk

      # Keeps the APK this run built, so it can be downloaded from the run's
      # page and installed on a phone for testing. Private to people with
      # access to the repository, and expires; a public release is what
      # release.yml publishes.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: alarm-plus-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
