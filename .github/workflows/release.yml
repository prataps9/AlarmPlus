name: Release

# Cuts a real, versioned release: tag a commit as vX.Y.Z (or run this
# manually) and it builds a release APK + AAB and publishes them to a
# GitHub Release. Ordinary pushes to main no longer create a release on
# their own — see ci.yml for the check that runs on every push/PR instead.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_name:
        description: >
          Version to build (e.g. 1.2.0). Leave blank to use the version
          from pubspec.yaml.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Gradle memory
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "kotlin.daemon.jvm.options=-Xmx1024m" >> android/gradle.properties
          echo "kotlin.incremental=false" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties

      # Optional: produces a real, Play-Store-ready signature instead of the
      # debug-key fallback. Only runs when the keystore secret is set (see
      # android/generate_release_key.sh for how to create the keystore, then
      # base64 it with `base64 -i android/app/upload-keystore.jks` for the
      # ANDROID_KEYSTORE_BASE64 secret). Without these secrets, the build
      # falls back to debug signing with a Gradle warning, same as a local
      # build without android/key.properties.
      #
      # `if:` can't reference the secrets context directly, so this checks
      # it via an env-backed step output instead.
      - name: Check for release signing secret
        id: signing
        run: echo "configured=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        if: steps.signing.outputs.configured == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1 | tr -d '[:space:]')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release --build-name="${{ steps.version.outputs.version }}" --no-tree-shake-icons

      - name: Build release AAB
        run: flutter build appbundle --release --build-name="${{ steps.version.outputs.version }}" --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Alarm+ v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
